<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CodeLive Studio (CLS)</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#0b0f19;
    color:#fff;
    height:100vh;
    overflow:hidden;
}

header{
    height:58px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    background:#111827;
    border-bottom:1px solid #263044;
}

.logo{
    font-size:19px;
    font-weight:bold;
}

.logo span{
    color:#00e5ff;
}

.buttons{
    display:flex;
    gap:7px;
}

button{
    border:0;
    border-radius:7px;
    padding:9px 13px;
    color:white;
    background:#1f2937;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#374151;
}

.run{
    background:#00a86b;
}

.run:hover{
    background:#00c47d;
}

.layout{
    display:grid;
    grid-template-columns:50% 50%;
    height:calc(100vh - 58px);
}

.editor{
    display:flex;
    flex-direction:column;
    min-width:0;
}

.tabs{
    display:flex;
    background:#0f172a;
    border-bottom:1px solid #263044;
}

.tab{
    padding:12px 18px;
    cursor:pointer;
    color:#9ca3af;
}

.tab.active{
    color:#fff;
    background:#1e293b;
}

.editor-area{
    flex:1;
    position:relative;
}

textarea{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    resize:none;
    border:0;
    outline:0;
    padding:16px;
    background:#090d16;
    color:#d1d5db;
    font-family:Consolas,monospace;
    font-size:14px;
    line-height:1.6;
    tab-size:2;
}

.panel{
    display:flex;
    flex-direction:column;
    min-width:0;
    border-left:1px solid #263044;
}

.panel-title{
    height:43px;
    display:flex;
    align-items:center;
    padding:0 14px;
    background:#0f172a;
    border-bottom:1px solid #263044;
}

iframe{
    width:100%;
    flex:1;
    border:0;
    background:white;
}

.console{
    height:145px;
    background:#05070b;
    border-top:1px solid #263044;
    overflow:auto;
    padding:10px;
    font-family:Consolas,monospace;
    font-size:13px;
}

.log{
    margin:3px 0;
    color:#d1d5db;
}

.error{
    color:#ff6b6b;
}

.success{
    color:#5ee6a8;
}

@media(max-width:800px){
    body{
        overflow:auto;
    }

    .layout{
        grid-template-columns:1fr;
        height:auto;
    }

    .editor{
        height:55vh;
    }

    .panel{
        height:60vh;
        border-left:0;
        border-top:1px solid #263044;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">
        ⚡ CodeLive Studio <span>(CLS)</span>
    </div>

    <div class="buttons">
        <button class="run" onclick="runCode()">▶ Chạy</button>
        <button onclick="saveCode()">💾 Lưu</button>
        <button onclick="loadCode()">📂 Tải</button>
        <button onclick="resetCode()">↻ Reset</button>
    </div>
</header>

<div class="layout">

    <section class="editor">

        <div class="tabs">
            <div class="tab active" onclick="switchTab('html')">HTML</div>
            <div class="tab" onclick="switchTab('css')">CSS</div>
            <div class="tab" onclick="switchTab('js')">JavaScript</div>
        </div>

        <div class="editor-area">

<textarea id="htmlCode"><div class="box">
  <h1>Xin chào CodeLive Studio!</h1>
  <p>Đây là chương trình đầu tiên của bạn.</p>
  <button onclick="hello()">Bấm vào đây</button>
</div></textarea>

<textarea id="cssCode" style="display:none">body {
  font-family: Arial;
  text-align: center;
  padding: 50px;
  background: #111827;
  color: white;
}

.box {
  max-width: 500px;
  margin: auto;
  padding: 30px;
  border-radius: 20px;
  background: #1f2937;
}

h1 {
  color: #00e5ff;
}

button {
  padding: 12px 20px;
  border: none;
  border-radius: 8px;
  background: #00a86b;
  color: white;
  cursor: pointer;
}</textarea>

<textarea id="jsCode">function hello() {
  alert("Bạn vừa chạy JavaScript trong CLS!");
}

console.log("CodeLive Studio đã khởi động!");</textarea>

        </div>
    </section>

    <section class="panel">

        <div class="panel-title">
            🖥️ Preview
        </div>

        <iframe id="preview" sandbox="allow-scripts allow-modals"></iframe>

        <div class="console" id="console">
            <div class="success">CLS Console — sẵn sàng.</div>
        </div>

    </section>

</div>

<script>

let currentTab = "html";

const htmlEditor = document.getElementById("htmlCode");
const cssEditor = document.getElementById("cssCode");
const jsEditor = document.getElementById("jsCode");
const preview = document.getElementById("preview");
const consoleBox = document.getElementById("console");

function switchTab(tab){

    currentTab = tab;

    htmlEditor.style.display = tab === "html" ? "block" : "none";
    cssEditor.style.display = tab === "css" ? "block" : "none";
    jsEditor.style.display = tab === "js" ? "block" : "none";

    document.querySelectorAll(".tab").forEach(x=>{
        x.classList.remove("active");
    });

    const tabs = document.querySelectorAll(".tab");

    if(tab === "html") tabs[0].classList.add("active");
    if(tab === "css") tabs[1].classList.add("active");
    if(tab === "js") tabs[2].classList.add("active");
}

function addConsole(message, type="log"){

    const div = document.createElement("div");

    div.className = "log " + type;

    div.textContent = message;

    consoleBox.appendChild(div);

    consoleBox.scrollTop = consoleBox.scrollHeight;
}

function runCode(){

    consoleBox.innerHTML =
        '<div class="success">▶ Đang chạy code...</div>';

    const html = htmlEditor.value;
    const css = cssEditor.value;
    const js = jsEditor.value;

    const consoleScript = `
        const oldLog = console.log;

        console.log = function(...args){
            parent.postMessage({
                type:"console",
                message:args.map(String).join(" ")
            },"*");

            oldLog.apply(console,args);
        };

        window.onerror = function(message){
            parent.postMessage({
                type:"error",
                message:String(message)
            },"*");
        };
    `;

    const documentCode = `
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
${css}
</style>

</head>

<body>

${html}

<script>

${consoleScript}

try {

${js}

} catch(error) {

parent.postMessage({
    type:"error",
    message:error.toString()
},"*");

}

<\/script>

</body>
</html>
`;

    preview.srcdoc = documentCode;

    addConsole("✓ Code đã được chạy.", "success");
}

window.addEventListener("message", function(event){

    if(!event.data) return;

    if(event.data.type === "console"){
        addConsole("> " + event.data.message);
    }

    if(event.data.type === "error"){
        addConsole("❌ " + event.data.message, "error");
    }

});

function saveCode(){

    const data = {
        html: htmlEditor.value,
        css: cssEditor.value,
        js: jsEditor.value
    };

    localStorage.setItem(
        "CodeLiveStudio",
        JSON.stringify(data)
    );

    addConsole("✓ Đã lưu code vào trình duyệt.", "success");
}

function loadCode(){

    const saved = localStorage.getItem("CodeLiveStudio");

    if(!saved){
        addConsole("⚠ Chưa có code được lưu.", "error");
        return;
    }

    const data = JSON.parse(saved);

    htmlEditor.value = data.html || "";
    cssEditor.value = data.css || "";
    jsEditor.value = data.js || "";

    addConsole("✓ Đã tải code.", "success");

    runCode();
}

function resetCode(){

    if(!confirm("Bạn có chắc muốn reset code?")) return;

    htmlEditor.value =
`<h1>Hello CLS!</h1>
<p>CodeLive Studio đang hoạt động.</p>`;

    cssEditor.value =
`body {
  font-family: Arial;
  text-align: center;
  padding: 50px;
  background: #111827;
  color: white;
}`;

    jsEditor.value =
`console.log("Hello from CodeLive Studio!");`;

    runCode();
}

/* Cho phép phím Tab trong editor */

document.querySelectorAll("textarea").forEach(editor=>{

    editor.addEventListener("keydown", function(e){

        if(e.key === "Tab"){

            e.preventDefault();

            const start = this.selectionStart;
            const end = this.selectionEnd;

            this.value =
                this.value.substring(0,start) +
                "  " +
                this.value.substring(end);

            this.selectionStart =
            this.selectionEnd =
                start + 2;
        }

        /* Ctrl + Enter = Run */

        if(e.ctrlKey && e.key === "Enter"){
            runCode();
        }

    });

});

/* Tự chạy lần đầu */

runCode();

</script>

</body>
</html>
